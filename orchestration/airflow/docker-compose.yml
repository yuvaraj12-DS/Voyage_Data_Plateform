services:

  airflow-postgres:
    image: postgres:16
    container_name: voyage-airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U airflow -d airflow"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env.airflow

    depends_on:
      airflow-postgres:
        condition: service_healthy

    command:
      - bash
      - -c
      - |
        airflow db migrate


  airflow-api-server:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: voyage-airflow-api

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env.airflow

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    volumes:
      - ./dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs

    ports:
      - "8081:8081"

    command:
      - api-server
      - --host
      - "0.0.0.0"
      - --port
      - "8081"


  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: voyage-airflow-scheduler

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env.airflow

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    volumes:
      - ./dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs

    command:
      - scheduler


  airflow-dag-processor:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: voyage-airflow-dag-processor

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env.airflow

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    volumes:
      - ./dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs

    command:
      - dag-processor


  airflow-triggerer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: voyage-airflow-triggerer

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env.airflow

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    volumes:
      - ./dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs

    command:
      - triggerer


volumes:
  airflow_postgres_data:
  airflow_logs: