voyage_data_platform:
  target: orchestration

  outputs:

    orchestration:
      type: databricks
      method: http

      catalog: voyage
      schema: dbt_dev

      host: {{ env_var('My_DATABRICKS_WORKSPACE_HOST') }}
      http_path: {{ env_var('My_SQL_WAREHOUSE_HTTP_PATH') }}

      token: "{{ env_var('DBT_ACCESS_TOKEN') }}"

      threads: 2