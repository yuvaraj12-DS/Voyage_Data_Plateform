version: 2

models:

  - name: fct_marketing_funnel_daily

    description: >
      Daily campaign-level marketing funnel combining advertising,
      website activity, and synthetic 2026 booking results.
      Booking and revenue metrics use last-click attribution in this mart.
      Other attribution models are available in fct_marketing_attribution.

    columns:

      - name: date
        tests:
          - not_null

      - name: tenant_id
        tests:
          - not_null
          - relationships:
              arguments:
               to: ref('stg_tenants')
               field: tenant_id

      - name: campaign_id
        tests:
          - not_null
          - relationships:
             arguments: 
              to: ref('stg_campaigns')
              field: campaign_id

      - name: campaign_name
        tests:
          - not_null

      - name: impressions
        tests:
          - not_null

      - name: clicks
        tests:
          - not_null

      - name: spend
        tests:
          - not_null

      - name: website_sessions
        tests:
          - not_null

      - name: website_conversions
        tests:
          - not_null

      - name: bookings
        tests:
          - not_null

      - name: gross_booking_value
        tests:
          - not_null

      - name: net_revenue
        tests:
          - not_null