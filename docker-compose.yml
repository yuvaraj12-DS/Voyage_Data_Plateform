services:
  postgres:
    image: postgres:18
    container_name: voyage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: voyage
      POSTGRES_USER: voyage_user
      POSTGRES_PASSWORD: voyage_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: